<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#0a0512" />
    </linearGradient>

    <!-- Front Card Gradient -->
    <linearGradient id="frontCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>

    <!-- High-Contrast Cyan Back Card -->
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
  </defs>

  <!-- App Canvas Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Back Card (Tilted Left) -->
  <rect 
    x="90" y="96" width="220" height="320" rx="36" 
    fill="url(#cyanCard)" 
    stroke="#ffffff" stroke-width="12"
    transform="rotate(-16 200 256)" 
  />

  <!-- Front Card (Tilted Right) -->
  <g transform="rotate(8 290 270)">
    <rect 
      x="180" y="110" width="220" height="320" rx="36" 
      fill="url(#frontCard)" 
      stroke="#ffffff" stroke-width="14" 
    />
    
    <!-- Ultra-Bold Gacha Sparkle Star (Centred inside front card) -->
    <path 
      d="M290 190 
         C290 240 310 260 360 260 
         C310 260 290 280 290 330 
         C290 280 270 260 220 260 
         C270 260 290 240 290 190 Z" 
      fill="#ffffff" 
    />
  </g>

  <!-- High-Visibility Rarity/Merge Star (Top Right Corner Accent) -->
  <path 
    d="M400 40 
       C400 80 415 95 455 95 
       C415 95 400 110 400 150 
       C400 110 385 95 345 95 
       C385 95 400 80 400 40 Z" 
    fill="url(#gold)" 
  />
</svg>
