# The public demo: the whole instance, built as a static site and published to
# GitHub Pages.
#
# Nothing here is deployed until it has been played: the build job boots the
# built site in a real browser and plays it, and the deploy job only runs if
# that passed. A demo can build cleanly, boot cleanly and still be a blank
# page, because the server it talks to is inside the tab.
name: Demo

on:
  push:
    # dev builds and plays the demo but never deploys it: the Pages site is
    # public, and the deploy job below is gated on master.
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway: a partial upload is a
# broken page rather than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The shim's whole job is to behave exactly like better-sqlite3, so the
      # suite runs every case against both. It also carries the drift guards:
      # a second path to /api, a node import in the rules, or a route that
      # stops answering with the state it published.
      - run: npm test

      - run: npm run lint
      - run: npm run build

      # The catalog is a build input, not a build output: it takes hours of
      # polite crawling to make and is committed alongside the demo. Without
      # it there is nothing to boot, and a green build that shipped an empty
      # catalog would be worse than a red one.
      - name: The catalog is present
        run: |
          test -f demo/public/catalog.db || {
            echo "demo/public/catalog.db is missing. Run: npm run bake:catalog"
            exit 1
          }

      - run: npm run build:demo

      # Boots the built site in a real browser and plays it: the instance has
      # to start, the catalog has to load, and a summon has to grant a card.
      # Everything up to here would pass on a demo that renders a blank page.
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:demo

      # Screenshots of every tab, kept for a fortnight. When somebody says the
      # demo looks wrong, this is the difference between a bug report and a
      # guess about which build it was.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-screens
          path: shots/demo
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/demo

  # Only from master, and only behind a build that played the game.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
