# Build the image and push it to GHCR, so a server only ever needs the
# compose file.
#
# master publishes :latest, which is what every instance follows. Any other
# branch publishes under its own name, so `dev` is a staging build you can run
# on one box before it reaches anybody else.
name: Publish image

on:
  push:
    branches: [master, dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated here, which is slow but means a Raspberry Pi or an
      # ARM VPS can pull the same tag as an x86 box. A staging build goes to
      # one machine you own, so it skips the emulated half (see `platforms`).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `type=ref,event=branch` is the branch's own name, so `dev` publishes
          # :dev and nothing has to be taught about it. Off on master, which
          # already has :latest.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref_name != 'master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Parenthesised on purpose: && binds tighter than ||, so without them
          # this evaluates to the boolean true on master rather than a list.
          platforms: >-
            ${{ (github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/'))
                && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
