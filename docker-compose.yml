# Project name, so the volume and network are not named after the folder.
name: anico

# Runs a published image: this file is all a server needs. Set ANICO_IMAGE in
# a .env file beside it (see .env.example). To build from source instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  anico:
    image: ${ANICO_IMAGE:?Set ANICO_IMAGE in .env, e.g. ghcr.io/yourname/anico:latest}
    container_name: anico
    restart: unless-stopped
    ports:
      # Caddy talks to this. Bound to localhost so nothing else can.
      - "127.0.0.1:8080:8080"
    volumes:
      - anico-data:/data
    environment:
      # The database and everything else lives here.
      DATA_DIR: /data
      # Cookies are Secure by default because Caddy terminates TLS in front.
      # Set to "false" only for a plain-HTTP LAN instance.
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      # Fill the character catalog on first boot (about six minutes, once).
      CRAWL_ON_BOOT: "true"

volumes:
  anico-data:
